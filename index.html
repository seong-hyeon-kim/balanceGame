<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>밸런스 게임 – 요즘 SNS 인기 주제</title>
<meta name="description" content="틱톡, 인스타에서 화제인 요즘 밸런스 게임 질문들을 모아봤어요. 연애, 마라맛 극한선택, 갓생, 디지털 습관까지!" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <p class="eyebrow">🔥 요즘 SNS 화제 밸런스 게임</p>
      <h1>당신의 선택은?</h1>
      <p class="subtitle">틱톡·인스타에서 요즘 많이 도는 밸런스 게임 질문만 모았어요</p>
    </header>

    <nav class="category-bar" id="categoryBar" aria-label="카테고리 선택"></nav>

    <main class="game-wrap">
      <div class="progress-row">
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <span class="progress-label" id="progressLabel">1 / 10</span>
      </div>

      <section class="card" id="questionCard">
        <p class="tag" id="questionTag">연애·썸</p>
        <div class="options" id="optionsWrap">
          <button class="option option-a" id="optionA" type="button">
            <span class="option-emoji" id="emojiA"></span>
            <span class="option-text" id="textA"></span>
            <span class="option-bar"><span class="option-bar-fill" id="barA"></span></span>
            <span class="option-percent" id="percentA"></span>
          </button>

          <div class="vs">VS</div>

          <button class="option option-b" id="optionB" type="button">
            <span class="option-emoji" id="emojiB"></span>
            <span class="option-text" id="textB"></span>
            <span class="option-bar"><span class="option-bar-fill" id="barB"></span></span>
            <span class="option-percent" id="percentB"></span>
          </button>
        </div>
        <p class="hint" id="hint">둘 중 하나를 골라보세요!</p>
      </section>

      <div class="controls">
        <button class="btn ghost" id="shuffleBtn" type="button">🔀 순서 섞기</button>
        <button class="btn" id="nextBtn" type="button" disabled>다음 질문 →</button>
      </div>
    </main>

    <section class="result" id="resultScreen" hidden>
      <p class="eyebrow">🎉 완료!</p>
      <h2>이 카테고리 밸런스 게임 끝!</h2>
      <p id="resultSummary"></p>
      <div class="controls">
        <button class="btn ghost" id="restartBtn" type="button">🔁 다시 하기</button>
        <button class="btn" id="shareBtn" type="button">📋 결과 공유하기</button>
      </div>
    </section>

    <footer class="app-footer">
      <p>선택 비율은 재미를 위한 참여형 지표이며, 선택할 때마다 이 브라우저에 누적돼요.</p>
    </footer>
  </div>

  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
